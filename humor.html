<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Крылатый юмор — Ádel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .joke-card {
            background: white;
            border-radius: var(--radius-sm);
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }
        .joke-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .joke-title {
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .joke-text {
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .copy-btn {
            margin-top: 1rem;
            background: var(--accent-light);
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-btn:hover {
            background: var(--accent);
            color: white;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: 0.2s;
        }
        .toast.show {
            opacity: 1;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Ádel</a></div>
            <ul class="nav-links" id="navLinks"></ul>
        </nav>
    </header>

    <main>
        <h1>😄 Крылатый юмор</h1>
        <p>Короткие, добрые и остроумные истории от Ádel</p>

        <div id="jokesContainer">
            <div class="loading">Загрузка шуток...</div>
        </div>
    </main>

    <footer>
        <p>2026. Адель. Angel de la poesía. ✨</p>
        <a href="index.html">Главная</a> |
        <a href="about.html">Об авторе</a> |
        <a href="contacts.html">Контакты</a>
    </footer>

    <div id="toast" class="toast">✅ Скопировано</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="menu.js"></script>
        <script src="bug-report.js"></script>

<script>
    // ⚠️ Убедись, что тут твои реальные данные
    const SUPABASE_URL = 'https://qoqflgpkbzvdtleidtjw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvcWZsZ3BrYnp2ZHRsZWlkdGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDgxNDMsImV4cCI6MjEwODUyNDE0M30.jbTvyk0CCyFa3efzS3pzJwa7hjMrr5KRyNtttW2DzZQ';

    async function loadJokes() {
        const container = document.getElementById('jokesContainer');
        
        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const { data: jokes, error } = await supabase
                .from('works')
                .select('id, title, content')
                .eq('published', true)
                .eq('type', 'humor')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p>❌ Ошибка базы: ${error.message}</p>`;
                return;
            }
            
            if (!jokes || jokes.length === 0) {
                container.innerHTML = '<p>😔 Пока нет шуток.</p>';
                return;
            }
            
            container.innerHTML = jokes.map(joke => `
                <div class="joke-card">
                    <div class="joke-title">${escapeHtml(joke.title)}</div>
                    <div class="joke-text">${escapeHtml(joke.content).replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" data-joke="${escapeHtml(joke.title)} — ${escapeHtml(joke.content)}">📋 Скопировать шутку</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(btn.getAttribute('data-joke'));
                    showToast();
                });
            });
            
        } catch (error) {
            container.innerHTML = `<p>❌ Ошибка: ${error.message}</p>`;
        }
    }
    
    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    loadJokes();
</script>

    

</body>
  </html>

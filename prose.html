<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Проза — Ádel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        .prose-card {
            background: white;
            border-radius: var(--radius-sm);
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: var(--border);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .prose-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .prose-image {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 1px solid var(--accent-light);
        }
        .prose-content {
            flex: 1;
            min-width: 180px;
        }
        .prose-title {
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        .prose-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }
        .prose-description {
            color: var(--text-dark);
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }
        .read-more {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .modal-close:hover {
            color: var(--accent);
        }
        .modal-title {
            color: var(--accent);
            margin-bottom: 1rem;
            padding-right: 2rem;
        }
        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            border: 1px solid var(--accent-light);
        }
        .modal-text {
            line-height: 1.7;
            white-space: pre-wrap;
            font-family: 'Georgia', serif;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        .share-buttons {
            margin-top: 2rem; 
            display: flex; 
            gap: 1rem; 
            justify-content: center; 
            border-top: 1px solid #eee; 
            padding-top: 1.5rem;
            flex-wrap: wrap;
        }
        .share-btn {
            background: #9b59b6; 
            color: white; 
            border: none; 
            padding: 0.6rem 1.2rem; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            transition: 0.2s;
        }
        .share-btn:hover {
            background: #8e44ad;
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .prose-card {
                flex-direction: column;
            }
            .prose-image {
                width: 100%;
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Ádel</a></div>
            <ul class="nav-links" id="navLinks"></ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main>
        <h1>📖 Проза Адель</h1>
        <p>Рассказы, зарисовки, тихие истории от крылатой поэтессы.</p>
        
        <div id="proseContainer">
            <div class="loading">Загрузка рассказов...</div>
        </div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h2 class="modal-title" id="modalTitle"></h2>
            <img class="modal-image" id="modalImage" style="display: none;" alt="Иллюстрация">
            <div class="modal-text" id="modalText"></div>
            
            <!-- Кнопки шаринга -->
            <div class="share-buttons">
                <button class="share-btn" id="btnCopyText">📋 Скопировать текст</button>
                <button class="share-btn" id="btnCopyLink">🔗 Скопировать ссылку</button>
            </div>
        </div>
    </div>

    <div class="bug-widget" id="bugWidget">🐞</div>
    <div class="bug-widget-content" id="bugWidgetContent">
        <h3>🐞 Сообщить о проблеме</h3>
        <textarea placeholder="Опишите, что пошло не так..." rows="3"></textarea>
        <button>📸 Сделать скриншот и скачать отчёт</button>
        <small>Файл отправьте на adel.angel2026@gmail.com</small>
    </div>

    <footer>
        <p>2026. Адель. Angel de la poesía. ✨</p>
        <a href="index.html">Главная</a> |
        <a href="about.html">Об авторе</a> |
        <a href="contacts.html">Контакты</a>
    </footer>

    <script src="menu.js"></script>
    <script src="bug-report.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        let proseList = []; // Сохраняем глобально для поиска
        let currentProse = null;

        async function loadProse() {
            const container = document.getElementById('proseContainer');
            const SUPABASE_URL = 'https://qoqflgpkbzvdtleidtjw.supabase.co'; 
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvcWZsZ3BrYnp2ZHRsZWlkdGp3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5Mjk0ODE0MywiZXhwIjoyMTA4NTI0MTQzfQ.5q4asB-_LFhDnzikW_tWM37RzVq85YQGAEeP4ZMF0dU';
            
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // ДОБАВИЛИ slug в запрос
                const { data: proseData, error } = await supabase
                    .from('works')
                    .select('id, slug, title, full_text, description, image_url, created_at')
                    .eq('published', true)
                    .eq('type', 'prose')
                    .order('created_at', { ascending: false });

                if (error) {
                    container.innerHTML = `<p>❌ Ошибка базы: ${error.message}</p>`;
                    return;
                }
                
                if (!proseData || proseData.length === 0) {
                    container.innerHTML = '<p>Пока нет рассказов. Адель пишет тихо, но скоро появятся.</p>';
                    return;
                }
                
                proseList = proseData.map(item => ({
                    id: item.id,
                    slug: item.slug,
                    title: item.title,
                    date: item.created_at,
                    description: item.description || '',
                    image: item.image_url || '',
                    fullText: item.full_text || ''
                }));
                
                container.innerHTML = proseList.map(prose => `
                    <div class="prose-card" data-id="${prose.id}">
                        ${prose.image ? `<img class="prose-image" src="${prose.image}" alt="Иллюстрация" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <div class="prose-content">
                            <div class="prose-title">${escapeHtml(prose.title)}</div>
                            <div class="prose-date">${formatDate(prose.date)}</div>
                            <div class="prose-description">${escapeHtml(prose.description)}</div>
                            <div class="read-more">📖 Читать →</div>
                        </div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.prose-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.id;
                        const prose = proseList.find(p => p.id == id);
                        if (prose) openModal(prose);
                    });
                });

                checkUrlParams(); // Проверка ссылки при загрузке
                
            } catch (error) {
                console.error('Ошибка загрузки прозы:', error);
                container.innerHTML = `<p>❌ Ошибка: ${error.message}</p>`;
            }
        }
        
        function openModal(prose) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');
            const modalImage = document.getElementById('modalImage');
            
            currentProse = prose; // Сохраняем текущую прозу
            
            title.textContent = prose.title;
            text.innerHTML = escapeHtml(prose.fullText).replace(/\n/g, '<br>');
            
            if (prose.image) {
                modalImage.src = prose.image;
                modalImage.style.display = 'block';
            } else {
                modalImage.style.display = 'none';
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const id = urlParams.get('id');
            
            let targetProse = null;
            if (slug) targetProse = proseList.find(p => p.slug === slug);
            else if (id) targetProse = proseList.find(p => p.id == id);
            
            if (targetProse) openModal(targetProse);
        }

        // --- ЛОГИКА ШАРИНГА ---
        document.getElementById('btnCopyText').addEventListener('click', () => {
            if (!currentProse) return;
            const baseUrl = 'https://angel-adel.github.io/angel/prose.html';
            const linkParam = currentProse.slug ? `?slug=${currentProse.slug}` : `?id=${currentProse.id}`;
            const fullLink = baseUrl + linkParam;
            
            const textToCopy = `${currentProse.title}\n\n${currentProse.fullText}\n\nЧитать на сайте: ${fullLink}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("✅ Текст и ссылка скопированы!");
            });
        });

        document.getElementById('btnCopyLink').addEventListener('click', () => {
            if (!currentProse) return;
            const baseUrl = 'https://angel-adel.github.io/angel/prose.html';
            const linkParam = currentProse.slug ? `?slug=${currentProse.slug}` : `?id=${currentProse.id}`;
            const fullLink = baseUrl + linkParam;
            
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("✅ Ссылка на произведение скопирована!");
            });
        });
        
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        loadProse();
    </script>
</body>
</html>

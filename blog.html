<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Блог Крылатой — Ádel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .blog-post {
            background: white;
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: var(--border);
            transition: 0.2s;
        }
        .blog-post:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .blog-title {
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        .blog-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--accent-light);
            padding-bottom: 0.5rem;
        }
        .blog-content {
            line-height: 1.7;
            font-size: 1rem;
        }
        .blog-content p {
            margin-bottom: 1rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Ádel</a></div>
            <ul class="nav-links" id="navLinks"></ul>
        </nav>
    </header>

    <main>
        <h1>📝 Блог Крылатой</h1>
        <p>Заметки, мысли, стихи с крыльев</p>

        <div id="blogContainer">
            <div class="loading">Загрузка записей...</div>
        </div>
    </main>

    <footer>
        <p>2026. Адель. Angel de la poesía. ✨</p>
        <a href="index.html">Главная</a> |
        <a href="about.html">Об авторе</a> |
        <a href="contacts.html">Контакты</a>
    </footer>

        <script src="menu.js"></script>
    <script src="theme.js"></script>
    <script src="bug-report.js"></script>
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ
        const SUPABASE_URL = 'https://qoqflgpkbzvdtleidtjw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvcWZsZ3BrYnp2ZHRsZWlkdGp3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5Mjk0ODE0MywiZXhwIjoyMTA4NTI0MTQzfQ.5q4asB-_LFhDnzikW_tWM37RzVq85YQGAEeP4ZMF0dU';

        async function loadBlog() {
            const container = document.getElementById('blogContainer');
            
            try {
                const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data: posts, error } = await db
                    .from('blog')
                    .select('title, content, created_at, image_url')
                    .eq('published', true)
                    .order('created_at', { ascending: false }); // Новые сверху

                if (error) {
                    container.innerHTML = `<p>❌ Ошибка базы: ${error.message}</p>`;
                    return;
                }
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p>📭 Пока нет записей в блоге. Скоро появятся.</p>';
                    return;
                }
                
                container.innerHTML = posts.map(post => {
                    // Форматируем дату из created_at
                    const date = new Date(post.created_at).toLocaleDateString('ru-RU', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    return `
                        <div class="blog-post">
                            ${post.image_url ? `<img src="${post.image_url}" style="width:100%; max-height:300px; object-fit:cover; border-radius:8px; margin-bottom:1rem;" alt="Иллюстрация">` : ''}
                            <div class="blog-title">${escapeHtml(post.title)}</div>
                            <div class="blog-date">📅 ${date}</div>
                            <div class="blog-content">
                                <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Ошибка загрузки блога:', error);
                container.innerHTML = '<p>❌ Не удалось загрузить записи. Попробуйте позже.</p>';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        loadBlog();
    </script>
   </body>
</html>
